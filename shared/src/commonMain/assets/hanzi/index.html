<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>汉字练习</title>
  <script src="hanzi-writer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, 'PingFang SC', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    /* 字符选择 */
    .char-form {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 20px;
    }
    .char-label {
      font-size: 14px;
      color: #b3b3b3;
      white-space: nowrap;
    }
    .char-input {
      flex: 1;
      background: #333;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      font-size: 28px;
      text-align: center;
      padding: 6px;
      width: 60px;
      min-width: 0;
    }
    .btn-update {
      background: linear-gradient(135deg, #e8352a, #f5a623);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 区块标题 */
    .section-title {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      width: 100%;
      max-width: 360px;
      margin-bottom: 10px;
    }

    /* Canvas 容器 */
    .writer-wrap {
      background: #2a2a2a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
    }

    /* 控制按钮行 */
    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 70px;
      background: #333;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      padding: 8px 4px;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e8352a, #f5a623);
      border: none;
      font-weight: bold;
    }

    /* 提示文字 */
    .hint {
      font-size: 12px;
      color: #808080;
      width: 100%;
      max-width: 360px;
      margin-top: -18px;
      margin-bottom: 16px;
    }
    .char-symbol {
      color: #f5a623;
      font-weight: bold;
    }

    /* 错误提示 */
    #error-msg {
      display: none;
      color: #ff6b6b;
      font-size: 13px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding: 8px;
      background: rgba(255,75,75,0.1);
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- 字符选择 -->
  <form class="char-form" id="char-form">
    <span class="char-label">选择汉字</span>
    <input class="char-input" id="char-input" type="text" maxlength="1" value="我">
    <button class="btn-update" type="submit">更新</button>
  </form>

  <div id="error-msg" id="error-msg"></div>

  <!-- 动画区 -->
  <div class="section-title">📽 笔画动画</div>
  <div class="writer-wrap" id="animation-wrap">
    <div id="animation-target"></div>
  </div>
  <div class="controls">
    <button class="btn btn-primary" id="btn-animate">▶ 播放动画</button>
    <button class="btn" id="btn-toggle-outline-anim">轮廓 开/关</button>
  </div>

  <!-- 练字区 -->
  <div class="section-title">✍️ 练字测验</div>
  <div class="hint">用手指描绘「<span class="char-symbol" id="char-symbol">我</span>」的笔画</div>
  <div class="writer-wrap" id="quiz-wrap">
    <div id="quiz-target"></div>
  </div>
  <div class="controls">
    <button class="btn btn-primary" id="btn-quiz-reset">🔄 重新练习</button>
    <button class="btn" id="btn-toggle-outline-quiz">轮廓 开/关</button>
  </div>

<script>
  var animWriter = null;
  var quizWriter = null;
  var animOutline = true;
  var quizOutline = true;
  var SIZE = Math.min(window.innerWidth - 40, 320);

  document.getElementById('animation-wrap').style.width = SIZE + 'px';
  document.getElementById('animation-wrap').style.height = SIZE + 'px';
  document.getElementById('quiz-wrap').style.width = SIZE + 'px';
  document.getElementById('quiz-wrap').style.height = SIZE + 'px';

  function showError(msg) {
    var el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 3000);
  }

  function loadCharacter() {
    var char = document.getElementById('char-input').value.trim();
    if (!char) return;

    document.getElementById('char-symbol').textContent = char;
    document.getElementById('animation-target').innerHTML = '';
    document.getElementById('quiz-target').innerHTML = '';

    animWriter = HanziWriter.create('animation-target', char, {
      width: SIZE,
      height: SIZE,
      padding: 10,
      showOutline: animOutline,
      showCharacter: false,
      strokeColor: '#e8352a',
      outlineColor: '#555555',
      drawingColor: '#f5a623',
      onLoadCharDataSuccess: function() {},
      onLoadCharDataError: function() {
        showError('未找到「' + char + '」的笔画数据，请尝试其他汉字');
      }
    });

    quizWriter = HanziWriter.create('quiz-target', char, {
      width: SIZE,
      height: SIZE,
      padding: 10,
      showOutline: quizOutline,
      showCharacter: false,
      showHintAfterMisses: 2,
      strokeColor: '#e8352a',
      outlineColor: '#555555',
      drawingColor: '#f5a623',
      highlightColor: '#f5a623',
      onLoadCharDataError: function() {}
    });
    quizWriter.quiz();
  }

  document.getElementById('char-form').addEventListener('submit', function(e) {
    e.preventDefault();
    loadCharacter();
  });

  document.getElementById('btn-animate').addEventListener('click', function() {
    if (animWriter) animWriter.animateCharacter();
  });

  document.getElementById('btn-toggle-outline-anim').addEventListener('click', function() {
    if (!animWriter) return;
    animOutline = !animOutline;
    animOutline ? animWriter.showOutline() : animWriter.hideOutline();
  });

  document.getElementById('btn-quiz-reset').addEventListener('click', function() {
    if (quizWriter) quizWriter.quiz();
  });

  document.getElementById('btn-toggle-outline-quiz').addEventListener('click', function() {
    if (!quizWriter) return;
    quizOutline = !quizOutline;
    quizOutline ? quizWriter.showOutline() : quizWriter.hideOutline();
  });

  // 初始加载
  loadCharacter();
</script>
</body>
</html>
